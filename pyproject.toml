[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-byzantine-fault-arbiter"
version = "0.1.0"
description = "Byzantine fault-tolerant consensus arbiter detecting and isolating hallucinating or adversarial agents in multi-agent swarms"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-byzantine-fault-arbiter = "agent_byzantine_fault_arbiter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_byzantine_fault_arbiter*"]
